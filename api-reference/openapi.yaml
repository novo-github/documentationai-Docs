openapi: 3.0.3
info:
  title: Watchmen REST API
  version: 1.0.0
  description: >
    The Watchmen REST API allows authorized users to retrieve specific data securely.
    API-Access Keys grant unrestricted access only to the endpoints documented below.
    These keys **cannot** be used to access any other APIs on `watchmen.novoai.de`.


    ## Authentication


    All API requests must include either:


    - A **JWT** in the **Authorization** header using the `Bearer` token scheme, OR

    - An **API-Access Key** in the **X-API-KEY** header with the generated token in string format.


    ### Example Authorization Header


    `Authorization: Bearer <Bearer-Token>`


    OR


    `X-API-KEY: <API-AccessKey>`


    ## Generating an API-Access Key


    1. **Navigate to the Admin Panel** — Go to the **API Access Keys** section.

    2. Click **Create New** API Access Key.

    3. Set a validity period (maximum: 1 year).

    4. Copy the key securely. It **cannot** be retrieved later.


    ## Required Headers


    | Header | Type | Required | Description |

    |--------|------|----------|-------------|

    | `Content-Type` | string | Yes | Must be `application/json` |

    | `X-API-KEY` | string | Yes | API Access Key for authentication |

    | `Authorization` | string | Yes (if using JWT) | Bearer token for JWT authentication |

    | `Cache-Control` | string | No | Defines cache policies |

    | `Access-Control-Allow-Origin` | string | No | Specifies allowed cross-origin requests |


    ## Base URL


    Use the base URL: `https://wm.novoai.de`


    For testing the integration, access to a development server could also be provided on request.


    ## Security Considerations


    - **Limited Scope:** API-Access Keys provide access **only** to the endpoints listed in this documentation.

    - **Key Protection:** Never expose the API-Access Key in client-side applications or logs.

    - **Regeneration & Revocation:** Expired or compromised keys should be revoked and regenerated via the Admin Panel.
  license:
    name: MIT
  contact:
    name: Novo AI
    url: https://watchmen.novoai.de
servers:
  - url: https://wm.novoai.de
    description: Production server
security:
  - bearerAuth: []
  - apiKeyAuth: []
tags:
  - name: Halls
    description: Retrieve hall information associated with the company
  - name: Machines
    description: Retrieve machine information associated with the company
  - name: Timeline Reasons
    description: Manage timeline reasons for tracking machine downtimes and operational events
  - name: Analytics
    description: Retrieve machine analytics data for a single day
paths:
  /v2/halls:
    get:
      tags:
        - Halls
      summary: Retrieve all halls
      description: >
        Retrieves all halls associated with the company for an authenticated user.

        The user must have the necessary permissions to access the halls.
      operationId: getAllHalls
      security:
        - bearerAuth: []
        - apiKeyAuth: []
      parameters:
        - $ref: '#/components/parameters/AcceptHeader'
      responses:
        '200':
          description: The response contains a list of halls associated with the company.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HallListResponse'
              example:
                status: 1
                hall_list:
                  - id: 1
                    name: Main Hall
                    description: Main manufacturing hall
                    meta_frontend: {}
                    active: true
        '404':
          description: No halls exist for the company.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                status: 0
                message: No halls found.
        '500':
          description: Unexpected server error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                status: 0
                message: An unexpected error occurred.
      x-codeSamples:
        - lang: cURL
          source: |
            curl -X 'GET' 'https://wm.novoai.de/v2/halls/' \
              -H 'accept: application/json' \
              -H 'X-API-KEY: your_api_access_key_here'
  /v2/halls/{id}:
    get:
      tags:
        - Halls
      summary: Retrieve a specific hall
      description: >
        Retrieves details of a specific hall identified by its unique `id`.

        The user must have the necessary permissions to access the hall.
      operationId: getHallById
      security:
        - bearerAuth: []
        - apiKeyAuth: []
      parameters:
        - $ref: '#/components/parameters/AcceptHeader'
        - name: id
          in: path
          required: true
          description: The unique identifier of the hall to retrieve.
          schema:
            type: integer
          example: 1
      responses:
        '200':
          description: The response contains detailed information about the requested hall.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Hall'
              example:
                id: 1
                name: Main Hall
                description: Main manufacturing hall
                meta_frontend: {}
                active: true
        '404':
          description: The requested hall does not exist.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                status: 0
                message: Hall not found.
        '500':
          description: Unexpected server error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                status: 0
                message: An unexpected error occurred.
      x-codeSamples:
        - lang: cURL
          source: |
            curl -X 'GET' 'https://wm.novoai.de/v2/halls/1' \
              -H 'accept: application/json' \
              -H 'X-API-KEY: your_api_access_key_here'
  /v2/machine:
    get:
      tags:
        - Machines
      summary: Retrieve all machines
      description: >
        Retrieves all machines associated with the authenticated user's company.

        The user must have the necessary permissions to access the machines.

        An optional query parameter can be used to include inactive machines.
      operationId: getAllMachines
      security:
        - bearerAuth: []
        - apiKeyAuth: []
      parameters:
        - $ref: '#/components/parameters/AcceptHeader'
        - name: all
          in: query
          required: false
          description: If set to `true`, includes inactive machines in the response.
          schema:
            type: boolean
            default: false
          example: true
      responses:
        '200':
          description: The response contains a list of machines associated with the company.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MachineListResponse'
              example:
                status: 1
                machine_list:
                  - id: 1
                    name: Machine A
                    public_id: MACH-001
                    description: High precision lathe
                    current: 5.2
                    voltage: 220
                    meta_frontend: {}
                    meta_backend: {}
                    active: true
                    ratings: 4.5
                    created_at: '2025-02-25'
                    hall:
                      id: 1
                      name: Main Hall
                    tag_list:
                      - id: 11
                        name: Tag1
                    ava:
                      - id: 21
                        name: AVA1
                        mac_id: MAC123
                        priority: 1
                    shift_group:
                      id: 31
                      name: Day Shift
        '404':
          description: No machines exist for the company.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                status: 0
                message: No machines found.
        '500':
          description: Unexpected server error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                status: 0
                message: An unexpected error occurred.
      x-codeSamples:
        - lang: cURL
          source: |
            curl -X 'GET' 'https://wm.novoai.de/v2/machine/' \
              -H 'accept: application/json' \
              -H 'X-API-KEY: your_api_access_key_here'
  /v2/timeline_reason:
    get:
      tags:
        - Timeline Reasons
      summary: Retrieve all timeline reasons
      description: >
        Retrieves all timeline reasons associated with the current company.

        These reasons are used to track machine downtimes, operational issues, and other significant events.
      operationId: getAllTimelineReasons
      security:
        - bearerAuth: []
        - apiKeyAuth: []
      parameters:
        - $ref: '#/components/parameters/AcceptHeader'
      responses:
        '200':
          description: The response contains a list of timeline reasons associated with the company.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TimelineReasonListResponse'
              example:
                status: 1
                timeline_reason_list:
                  - id: 1
                    name: Downtime
                    level: Critical
                    reason: Power failure
                    meta_backend: {}
                    meta_frontend: {}
        '404':
          description: No timeline reasons exist for the company.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                status: 0
                message: No timeline reasons are set. Get started by adding them from Admin Panel.
        '500':
          description: Unexpected server error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                status: 0
                message: An unexpected error occurred.
      x-codeSamples:
        - lang: cURL
          source: |
            curl -X 'GET' 'https://wm.novoai.de/v2/timeline_reason/' \
              -H 'accept: application/json' \
              -H 'X-API-KEY: your_api_access_key_here'
  /v2/timeline/reason_assign:
    post:
      tags:
        - Timeline Reasons
      summary: Assign a timeline reason
      description: >
        Assigns a timeline reason to a machine, allowing users to track specific operational events

        such as machine downtimes or other predefined reasons. The assignment can be used for labeling

        machine status changes in real-time or for historical adjustments.
      operationId: assignTimelineReason
      security:
        - bearerAuth: []
        - apiKeyAuth: []
      parameters:
        - $ref: '#/components/parameters/AcceptHeader'
        - $ref: '#/components/parameters/ContentTypeHeader'
      requestBody:
        required: true
        description: The request body should contain a list of machine timeline reason assignments.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TimelineReasonAssignRequest'
            example:
              data:
                - machine_id: 1
                  timeline_reason_id: 1
                  operation: add
                  idx: 1
      responses:
        '200':
          description: Successfully assigned the timeline reason.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TimelineReasonAssignResponse'
              example:
                message: Successfully assigned timeline reason.
                status: 1
        '400':
          description: Invalid request format.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                status: 0
                message: Invalid request data.
        '401':
          description: Invalid authentication credentials.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                status: 0
                message: Unauthorized access.
        '404':
          description: The specified machine or timeline reason does not exist.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                status: 0
                message: Machine with ID 1 not found for the current company.
        '500':
          description: Unexpected server error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                status: 0
                message: An unexpected error occurred.
      x-codeSamples:
        - lang: cURL
          source: |
            curl -X 'POST' 'https://wm.novoai.de/v2/timeline/reason_assign' \
              -H 'accept: application/json' \
              -H 'X-API-KEY: your_api_access_key_here' \
              -H 'Content-Type: application/json' \
              -d '{
                    "data": [
                      {
                        "machine_id": 1,
                        "timeline_reason_id": 1,
                        "operation": "add",
                        "idx": 1
                      }
                    ]
                  }'
  /v2/timeline/reason_preset:
    post:
      tags:
        - Timeline Reasons
      summary: Preset a timeline reason
      description: >
        Allows users to preset a timeline reason for a machine.

        It is useful for real-time or pre-scheduled event labeling, ensuring accurate machine activity tracking.
      operationId: presetTimelineReason
      security:
        - bearerAuth: []
        - apiKeyAuth: []
      parameters:
        - $ref: '#/components/parameters/AcceptHeader'
        - $ref: '#/components/parameters/ContentTypeHeader'
      requestBody:
        required: true
        description: The request body should contain the details of the machine and the timeline reason being assigned.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TimelineReasonPresetRequest'
            example:
              machine_id: 1
              reason_id: 1
              meta_frontend: {}
              idx: 1
      responses:
        '200':
          description: Successfully preset the timeline reason.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TimelineReasonPresetResponse'
              example:
                status: 1
                message: Live Timeline Reason Set Successfully
        '400':
          description: Missing required fields or incorrect request format.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                missingMachineId:
                  summary: Missing machine_id
                  value:
                    status: 0
                    message: Machine ID is required.
                missingReasonId:
                  summary: Missing reason_id
                  value:
                    status: 0
                    message: Reason ID is required.
        '401':
          description: Invalid authentication credentials.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                status: 0
                message: Unauthorized access.
        '404':
          description: The specified machine or timeline reason does not exist.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                machineNotFound:
                  summary: Machine not found
                  value:
                    status: 0
                    message: Machine with ID 1 not found for the current company.
                reasonNotFound:
                  summary: Timeline reason not found
                  value:
                    status: 0
                    message: Timeline reason with ID 1 not found for the current company.
        '500':
          description: Unexpected server error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                status: 0
                message: An unexpected error occurred.
      x-codeSamples:
        - lang: cURL
          source: |
            curl -X 'POST' 'https://wm.novoai.de/v2/timeline/reason_preset' \
              -H 'accept: application/json' \
              -H 'X-API-KEY: your_api_access_key_here' \
              -H 'Content-Type: application/json' \
              -d '{
                    "machine_id": 1,
                    "reason_id": 1,
                    "meta_frontend": {},
                    "idx": 1
                  }'
  /v2/analytics/day:
    post:
      tags:
        - Analytics
      summary: Retrieve machine data for a single day
      description: >
        Retrieves comprehensive machine analytics for a single calendar day (with adjustments for shift boundaries).

        It aggregates shift data, real-time status info, live and planned orders, and optional timeseries data

        for features or legacy pulse. It supports processing either synchronously or asynchronously.


        When `async` is `true`, the response returns an `actor_name` and `message_id` immediately.

        You must then use the `POST /v2/analytics/` endpoint with the `actor_name` and `message_id` to retrieve the result.
      operationId: getAnalyticsDay
      security:
        - bearerAuth: []
        - apiKeyAuth: []
      parameters:
        - $ref: '#/components/parameters/AcceptHeader'
        - $ref: '#/components/parameters/ContentTypeHeader'
        - name: async
          in: query
          required: false
          description: >
            Default `false`. If `true`, returns an `actor_name` and `message_id` immediately instead of

            waiting for the full result. Use the `POST /v2/analytics/` endpoint to retrieve the result afterward.
          schema:
            type: boolean
            default: false
          example: false
        - name: csv_format
          in: query
          required: false
          description: Default `false`. If `true`, returns CSV formatted data inside the JSON result (if the actor supports it).
          schema:
            type: boolean
            default: false
          example: false
      requestBody:
        required: true
        description: Request body containing the analytics query parameters for the target day.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AnalyticsDayRequest'
            example:
              machine_list:
                - 1
              date: '2025-02-24'
              features: true
              timeline: true
              live_orders: true
              window_period: 5m
      responses:
        '200':
          description: >
            Successful response. When `async` is `false`, returns the full machine analytics data.

            When `async` is `true`, returns an `actor_name` and `message_id` for retrieving the result later.

            Note: If logical checks fail (e.g., machine access issues), the API returns 200 but includes an error message in the body.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/AnalyticsDaySyncResponse'
                  - $ref: '#/components/schemas/AnalyticsDayAsyncResponse'
              examples:
                synchronous:
                  summary: Synchronous response (async=false)
                  value:
                    machine_dict:
                      '1':
                        id: 1
                        name: Machine A
                        hall:
                          id: 1
                          name: Hall 1
                        shift_group:
                          id: 2
                          name: Group A
                        ratings: 4.5
                        state: 1
                        last_heartbeat: '2025-02-24 15:29:55'
                        live_timeline_reason:
                          idx: 12345
                          is_set: false
                          created_at: '2025-02-24 15:00:00'
                          can_set: true
                        day_data:
                          availability: 0.85
                          performance: 0.90
                          quality: 0.99
                          oee: 0.757
                          production_duration: 25000
                          idle_duration: 2000
                          off_duration: 0
                          timeline_reason:
                            columns:
                              - timeline_reason_id
                              - timeline_reason_name
                              - duration_sec
                              - idx
                              - total_sec
                              - color
                            data:
                              - - 1
                                - Setup
                                - 1200
                                - 1
                                - 1200
                                - '#CCCCCC'
                        shift_data:
                          Shift 1:
                            shift_start: '2025-02-24T06:00:00'
                            shift_end: '2025-02-24T14:00:00'
                            availability: 0.88
                        tag_list:
                          - id: 11
                            name: Tag1
                        timeline:
                          columns:
                            - idx
                            - start
                            - end
                            - state
                            - timeline_reason_id
                            - start_timestamp
                            - end_timestamp
                          data:
                            - - 101
                              - '2025-02-24 06:00:00'
                              - '2025-02-24 07:00:00'
                              - 2
                              - null
                              - 1740376800
                              - 1740380400
                        features:
                          - id: 10
                            name: Speed
                            unit: rpm
                            multiplication_factor: 1.0
                            field_name: rpm
                        timeseries_features:
                          Speed:
                            columns:
                              - _time
                              - value
                            data:
                              - - 1740376800
                                - 1200
                              - - 1740376860
                                - 1205
                        live_orders:
                          - order_id: 505
                            order_name: Order-ABC
                            assignment_id: 99
                            status: active
                            product:
                              id: 10
                              name: Widget X
                        interval_list:
                          - id: 800
                            start: '2025-02-24 08:00:00'
                            end: '2025-02-24 09:00:00'
                            produced_qty: 500
                            product:
                              id: 10
                              name: Widget X
                        range_analysis:
                          - range_label:
                              lower: 300
                              upper: 600
                            instance_count: 5
                            total_seconds: 2000
                    status: 1
                    response_time: 0.452
                asynchronous:
                  summary: Asynchronous response (async=true)
                  value:
                    actor_name: machinesingledaytimescalex
                    message_id: 3be56d78-3a9d-4786-9a2f-123456789abc
                errorNoAccess:
                  summary: Logical error - no access to machine (200 with error message)
                  value:
                    status: 0
                    message: You do not have access to requested machine
                    machine_dict: {}
                    response_time: 0.123
                errorNoMachines:
                  summary: Logical error - no machines found (200 with status 1)
                  value:
                    status: 1
                    message: No machines found in the company for the provided machine_list
                    machine_dict: {}
                    response_time: 0.05
        '400':
          description: Invalid request format, date format, or future date.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                status: 0
                message: Invalid current_time_reset format...
        '500':
          description: Unexpected server error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                status: 0
                message: An unexpected error occurred.
      x-codeSamples:
        - lang: cURL
          source: |
            curl -X POST 'https://wm.novoai.de/v2/analytics/day' \
              -H 'accept: application/json' \
              -H 'X-API-KEY: YOUR_KEY' \
              -H 'Content-Type: application/json' \
              -d '{
                    "machine_list": [1],
                    "date": "2025-02-24",
                    "features": true,
                    "timeline": true,
                    "live_orders": true,
                    "window_period": "5m"
                  }'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT Bearer token authentication. Include in the Authorization header as `Bearer <token>`.
    apiKeyAuth:
      type: apiKey
      in: header
      name: X-API-KEY
      description: API-Access Key authentication. Include the generated key in the `X-API-KEY` header.
  parameters:
    AcceptHeader:
      name: accept
      in: header
      required: true
      description: Must be `application/json`.
      schema:
        type: string
        default: application/json
      example: application/json
    ContentTypeHeader:
      name: Content-Type
      in: header
      required: true
      description: Must be `application/json` for POST requests.
      schema:
        type: string
        default: application/json
      example: application/json
  schemas:
    ErrorResponse:
      type: object
      required:
        - status
        - message
      properties:
        status:
          type: integer
          description: Indicates the success of the request. `1` for success, `0` for failure.
        message:
          type: string
          description: Error or status message.
    Hall:
      type: object
      properties:
        id:
          type: integer
          description: Unique identifier for the hall.
        name:
          type: string
          description: Name of the hall.
        description:
          type: string
          description: Description of the hall.
        meta_frontend:
          type: object
          description: Additional frontend metadata.
          additionalProperties: true
        active:
          type: boolean
          description: Indicates if the hall is active.
    HallListResponse:
      type: object
      required:
        - status
        - hall_list
      properties:
        status:
          type: integer
          description: Indicates the success of the request. `1` for success, `0` for failure.
        hall_list:
          type: array
          description: A list of halls associated with the company.
          items:
            $ref: '#/components/schemas/Hall'
    HallRef:
      type: object
      description: Minimal hall reference.
      properties:
        id:
          type: integer
          description: Hall ID.
        name:
          type: string
          description: Hall name.
    Tag:
      type: object
      properties:
        id:
          type: integer
          description: Tag ID.
        name:
          type: string
          description: Tag name.
    AVA:
      type: object
      description: Machine availability details.
      properties:
        id:
          type: integer
          description: Availability ID.
        name:
          type: string
          description: Availability name.
        mac_id:
          type: string
          description: Machine identifier.
        priority:
          type: integer
          description: Priority level.
    ShiftGroup:
      type: object
      properties:
        id:
          type: integer
          description: Shift group ID.
        name:
          type: string
          description: Shift group name.
    Machine:
      type: object
      properties:
        id:
          type: integer
          description: Unique identifier for the machine.
        name:
          type: string
          description: Name of the machine.
        public_id:
          type: string
          description: Public identifier of the machine.
        description:
          type: string
          description: Description of the machine.
        current:
          type: number
          format: float
          description: Current measured in amperes.
        voltage:
          type: integer
          description: Voltage level of the machine.
        meta_frontend:
          type: object
          description: Additional frontend metadata.
          additionalProperties: true
        meta_backend:
          type: object
          description: Additional backend metadata.
          additionalProperties: true
        active:
          type: boolean
          description: Whether the machine is active.
        ratings:
          type: number
          format: float
          description: Machine performance rating.
        created_at:
          type: string
          format: date
          description: Machine creation date in `YYYY-MM-DD` format.
        hall:
          $ref: '#/components/schemas/HallRef'
        tag_list:
          type: array
          description: Tags assigned to the machine.
          items:
            $ref: '#/components/schemas/Tag'
        ava:
          type: array
          description: Machine availability details.
          items:
            $ref: '#/components/schemas/AVA'
        shift_group:
          $ref: '#/components/schemas/ShiftGroup'
    MachineListResponse:
      type: object
      required:
        - status
        - machine_list
      properties:
        status:
          type: integer
          description: Indicates the success of the request. `1` for success, `0` for failure.
        machine_list:
          type: array
          description: A list of machines associated with the company.
          items:
            $ref: '#/components/schemas/Machine'
    TimelineReason:
      type: object
      properties:
        id:
          type: integer
          description: Unique identifier for the timeline reason.
        name:
          type: string
          description: Name of the timeline reason.
        level:
          type: string
          description: The severity level of the reason (e.g., Critical, Warning).
        reason:
          type: string
          description: A brief explanation of the timeline reason.
        meta_backend:
          type: object
          description: Additional metadata for backend usage.
          additionalProperties: true
        meta_frontend:
          type: object
          description: Additional metadata for frontend usage.
          additionalProperties: true
    TimelineReasonListResponse:
      type: object
      required:
        - status
        - timeline_reason_list
      properties:
        status:
          type: integer
          description: Indicates the success of the request. `1` for success, `0` for failure.
        timeline_reason_list:
          type: array
          description: A list of timeline reasons available for the company.
          items:
            $ref: '#/components/schemas/TimelineReason'
    TimelineReasonAssignItem:
      type: object
      required:
        - machine_id
        - timeline_reason_id
        - operation
        - idx
      properties:
        machine_id:
          type: integer
          description: The machine to which the reason is assigned.
        timeline_reason_id:
          type: integer
          description: The timeline reason ID being assigned.
        operation:
          type: string
          enum:
            - add
            - modify
            - delete
          description: 'The operation to be performed. Allowed values: `add`, `modify`, `delete`.'
        idx:
          type: integer
          description: The timeline entry index (used to reference a specific time range for assignment).
    TimelineReasonAssignRequest:
      type: object
      required:
        - data
      properties:
        data:
          type: array
          description: List of assignments.
          items:
            $ref: '#/components/schemas/TimelineReasonAssignItem'
    TimelineReasonAssignResponse:
      type: object
      required:
        - message
        - status
      properties:
        message:
          type: string
          description: Success confirmation message.
        status:
          type: integer
          description: Indicates the success of the request. `1` for success, `0` for failure.
    TimelineReasonPresetRequest:
      type: object
      required:
        - machine_id
        - reason_id
        - idx
      properties:
        machine_id:
          type: integer
          description: The machine to which the timeline reason is assigned.
        reason_id:
          type: integer
          description: The ID of the timeline reason being preset.
        meta_frontend:
          type: object
          description: Additional frontend metadata.
          additionalProperties: true
        idx:
          type: integer
          description: The timeline entry index for reference.
    TimelineReasonPresetResponse:
      type: object
      required:
        - status
        - message
      properties:
        status:
          type: integer
          description: Indicates the success of the request. `1` for success, `0` for failure.
        message:
          type: string
          description: Success confirmation message.
    AnalyticsDayRequest:
      type: object
      properties:
        machine_list:
          type: array
          description: IDs of machines. If empty or missing, fetches all accessible machines.
          items:
            type: integer
          default: []
          example:
            - 1
            - 2
        date:
          type: string
          format: date
          description: 'Target date (`YYYY-MM-DD`). Defaults to today if not provided.'
          example: '2025-02-24'
        energy_data:
          type: boolean
          description: Include `energy_consumption` and `energy_wastage` in calculations.
          default: false
        anomalies:
          type: boolean
          description: Include anomaly detection data.
          default: false
        cycles:
          type: boolean
          description: Include cycle lists (`cycles`).
          default: false
        timeline:
          type: boolean
          description: Include status timeline segments (`timeline`).
          default: false
        timeline_reason:
          type: boolean
          description: Include reason codes/durations nested within day/shift data properties.
          default: false
        pulse:
          type: boolean
          description: Include legacy pulse timeseries (`pulse`).
          default: false
        features:
          type: boolean
          description: Include generic machine feature timeseries (`features` and `timeseries_features`).
          default: false
        window_period:
          type: string
          description: 'Aggregation bucket size for `pulse` (e.g., `1m`, `5s`).'
          default: 1m
          example: 1m
        extern:
          type: boolean
          description: Include external data timeseries (`extern`).
          default: false
        range_analysis:
          type: boolean
          description: Include uptime range distribution analysis (`range_analysis`).
          default: false
        live_orders:
          type: boolean
          description: Include lists of currently running (`live_orders`) and planned (`planned_orders`) orders.
          default: false
        interval_list:
          type: boolean
          description: Include detailed production intervals (`interval_list`).
          default: false
        timeline_window:
          type: string
          nullable: true
          description: 'Overrides the lookback window for the `timeline` request (e.g., `3h` for last 3 hours).'
          default: null
          example: 3h
    LiveTimelineReason:
      type: object
      description: Live timeline reason status for a machine.
      properties:
        idx:
          type: integer
          description: Timeline entry index for the live reason.
        is_set:
          type: boolean
          description: Whether a live timeline reason is currently set.
        created_at:
          type: string
          description: Timestamp when the live reason was created.
        can_set:
          type: boolean
          description: Whether a new live reason can be set.
    TabularData:
      type: object
      description: Generic columnar data structure used for timeline, timeline_reason, and timeseries responses.
      properties:
        columns:
          type: array
          description: Column names for the data.
          items:
            type: string
        data:
          type: array
          description: Row data, where each row is an array of values matching the columns.
          items:
            type: array
            items: {}
    DayData:
      type: object
      description: Aggregated analytics data for the full day.
      properties:
        availability:
          type: number
          format: float
          description: Availability metric (0-1).
        performance:
          type: number
          format: float
          description: Performance metric (0-1).
        quality:
          type: number
          format: float
          description: Quality metric (0-1).
        oee:
          type: number
          format: float
          description: Overall Equipment Effectiveness (0-1).
        production_duration:
          type: integer
          description: Production duration in seconds.
        idle_duration:
          type: integer
          description: Idle duration in seconds.
        off_duration:
          type: integer
          description: Off duration in seconds.
        timeline_reason:
          $ref: '#/components/schemas/TabularData'
    ShiftDataEntry:
      type: object
      description: Analytics data for a single shift.
      properties:
        shift_start:
          type: string
          description: Shift start time (ISO 8601).
        shift_end:
          type: string
          description: Shift end time (ISO 8601).
        availability:
          type: number
          format: float
          description: Availability metric for the shift (0-1).
      additionalProperties: true
    Feature:
      type: object
      description: Machine feature definition.
      properties:
        id:
          type: integer
          description: Feature ID.
        name:
          type: string
          description: Feature name.
        unit:
          type: string
          description: Unit of measurement.
        multiplication_factor:
          type: number
          format: float
          description: Multiplication factor for the feature value.
        field_name:
          type: string
          description: Field name used to reference this feature.
    ProductRef:
      type: object
      description: Minimal product reference.
      properties:
        id:
          type: integer
          description: Product ID.
        name:
          type: string
          description: Product name.
    LiveOrder:
      type: object
      description: A currently running or planned production order.
      properties:
        order_id:
          type: integer
          description: Order ID.
        order_name:
          type: string
          description: Order name.
        assignment_id:
          type: integer
          description: Assignment ID.
        status:
          type: string
          description: 'Order status (e.g., `active`).'
        product:
          $ref: '#/components/schemas/ProductRef'
    IntervalItem:
      type: object
      description: A detailed production interval.
      properties:
        id:
          type: integer
          description: Interval ID.
        start:
          type: string
          description: Interval start time.
        end:
          type: string
          description: Interval end time.
        produced_qty:
          type: integer
          description: Quantity produced in this interval.
        product:
          $ref: '#/components/schemas/ProductRef'
    RangeAnalysisItem:
      type: object
      description: Uptime range distribution analysis entry.
      properties:
        range_label:
          type: object
          properties:
            lower:
              type: integer
              description: Lower bound of the range.
            upper:
              type: integer
              description: Upper bound of the range.
        instance_count:
          type: integer
          description: Number of instances in this range.
        total_seconds:
          type: integer
          description: Total seconds spent in this range.
    MachineAnalytics:
      type: object
      description: Comprehensive analytics data for a single machine on a given day.
      properties:
        id:
          type: integer
          description: Machine ID.
        name:
          type: string
          description: Machine name.
        hall:
          $ref: '#/components/schemas/HallRef'
        shift_group:
          $ref: '#/components/schemas/ShiftGroup'
        ratings:
          type: number
          format: float
          description: Machine performance rating.
        state:
          type: integer
          description: Current machine state.
        last_heartbeat:
          type: string
          description: Timestamp of the last heartbeat.
        live_timeline_reason:
          $ref: '#/components/schemas/LiveTimelineReason'
        day_data:
          $ref: '#/components/schemas/DayData'
        shift_data:
          type: object
          description: Analytics data keyed by shift name.
          additionalProperties:
            $ref: '#/components/schemas/ShiftDataEntry'
        tag_list:
          type: array
          description: Tags assigned to the machine.
          items:
            $ref: '#/components/schemas/Tag'
        timeline:
          $ref: '#/components/schemas/TabularData'
        features:
          type: array
          description: Machine feature definitions.
          items:
            $ref: '#/components/schemas/Feature'
        timeseries_features:
          type: object
          description: Generic machine feature timeseries keyed by feature name.
          additionalProperties:
            $ref: '#/components/schemas/TabularData'
        live_orders:
          type: array
          description: Currently running production orders.
          items:
            $ref: '#/components/schemas/LiveOrder'
        planned_orders:
          type: array
          description: Planned production orders.
          items:
            $ref: '#/components/schemas/LiveOrder'
        interval_list:
          type: array
          description: Detailed production intervals.
          items:
            $ref: '#/components/schemas/IntervalItem'
        range_analysis:
          type: array
          description: Uptime range distribution analysis.
          items:
            $ref: '#/components/schemas/RangeAnalysisItem'
    AnalyticsDaySyncResponse:
      type: object
      required:
        - machine_dict
        - status
        - response_time
      properties:
        machine_dict:
          type: object
          description: Machine analytics data keyed by machine ID (as string).
          additionalProperties:
            $ref: '#/components/schemas/MachineAnalytics'
        status:
          type: integer
          description: 'Indicates the success of the request. `1` for success, `0` for failure.'
        message:
          type: string
          description: 'Optional message (present in logical error responses, e.g., no access or no machines found).'
        response_time:
          type: number
          format: float
          description: Response time in seconds.
    AnalyticsDayAsyncResponse:
      type: object
      required:
        - actor_name
        - message_id
      properties:
        actor_name:
          type: string
          description: 'Actor name to use when retrieving the async result (e.g., `machinesingledaytimescalex`).'
        message_id:
          type: string
          format: uuid
          description: Unique message ID to use when retrieving the async result.